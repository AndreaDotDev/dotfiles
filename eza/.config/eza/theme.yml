# eza theme: Kanagawa Dragon
# palette: fg #c5c9c5 · gray #a6a69c · ash #737c73 · dim #625e5a
#          blue #8ba4b0 · aqua #8ea4a2 · green #87a987 · green2 #8a9a7b
#          yellow #c4b28a · orange #b6927b · red #c4746e · pink #a292a3 · violet #8992a7 · teal #949fb5
colourful: true

filekinds:
  normal: { foreground: "#c5c9c5" }
  directory: { foreground: "#8ba4b0", is_bold: true }
  symlink: { foreground: "#8ea4a2" }
  pipe: { foreground: "#a292a3" }
  block_device: { foreground: "#c4b28a", is_bold: true }
  char_device: { foreground: "#c4b28a" }
  socket: { foreground: "#a292a3", is_bold: true }
  special: { foreground: "#b6927b" }
  executable: { foreground: "#87a987", is_bold: true }
  mount_point: { foreground: "#8ba4b0", is_underline: true }

perms:
  user_read: { foreground: "#c4b28a" }
  user_write: { foreground: "#c4746e" }
  user_execute_file: { foreground: "#87a987", is_bold: true }
  user_execute_other: { foreground: "#87a987" }
  group_read: { foreground: "#a6a69c" }
  group_write: { foreground: "#a6a69c" }
  group_execute: { foreground: "#a6a69c" }
  other_read: { foreground: "#737c73" }
  other_write: { foreground: "#737c73" }
  other_execute: { foreground: "#737c73" }
  special_user_file: { foreground: "#a292a3" }
  special_other: { foreground: "#a292a3" }
  attribute: { foreground: "#625e5a" }

size:
  major: { foreground: "#a6a69c" }
  minor: { foreground: "#a6a69c" }
  number_byte: { foreground: "#a6a69c" }
  number_kilo: { foreground: "#8a9a7b" }
  number_mega: { foreground: "#c4b28a" }
  number_giga: { foreground: "#b6927b" }
  number_huge: { foreground: "#c4746e" }
  unit_byte: { foreground: "#737c73" }
  unit_kilo: { foreground: "#737c73" }
  unit_mega: { foreground: "#737c73" }
  unit_giga: { foreground: "#737c73" }
  unit_huge: { foreground: "#737c73" }

users:
  user_you: { foreground: "#c4b28a" }
  user_root: { foreground: "#c4746e" }
  user_other: { foreground: "#a6a69c" }
  group_yours: { foreground: "#a6a69c" }
  group_other: { foreground: "#737c73" }
  group_root: { foreground: "#c4746e" }

links:
  normal: { foreground: "#8ea4a2" }
  multi_link_file: { foreground: "#8ea4a2", is_bold: true }

git:
  new: { foreground: "#87a987" }
  modified: { foreground: "#c4b28a" }
  deleted: { foreground: "#c4746e" }
  renamed: { foreground: "#949fb5" }
  typechange: { foreground: "#a292a3" }
  ignored: { foreground: "#625e5a" }
  conflicted: { foreground: "#e46876" }

git_repo:
  branch_main: { foreground: "#8ba4b0" }
  branch_other: { foreground: "#a292a3" }
  git_clean: { foreground: "#87a987" }
  git_dirty: { foreground: "#c4746e" }

file_type:
  image: { foreground: "#a292a3" }
  video: { foreground: "#b6927b" }
  music: { foreground: "#8ea4a2" }
  lossless: { foreground: "#8ea4a2", is_bold: true }
  crypto: { foreground: "#c4746e" }
  document: { foreground: "#c5c9c5" }
  compressed: { foreground: "#b98d7b" }
  temp: { foreground: "#625e5a" }
  compiled: { foreground: "#737c73" }
  build: { foreground: "#c4b28a", is_bold: true }
  source: { foreground: "#c5c9c5" }

punctuation: { foreground: "#625e5a" }
date: { foreground: "#8992a7" }
inode: { foreground: "#737c73" }
blocks: { foreground: "#737c73" }
header: { foreground: "#c5c9c5", is_underline: true }
octal: { foreground: "#a292a3" }
flags: { foreground: "#949fb5" }
symlink_path: { foreground: "#8ea4a2" }
control_char: { foreground: "#c4746e" }
broken_symlink: { foreground: "#e46876" }
broken_path_overlay: { foreground: "#625e5a" }
