# ── Terminal ────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"   
set -g focus-events on                             
set -sg escape-time 10                             
set -g history-limit 50000
set -g mouse on

# ── Prefix ──────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# ── Windows & panes ─────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5

unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ── Copy mode (vi) ──────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ── Theme: Black Metal — Marduk (alt) ───────────────────────────────────
# palette (from black-metal-theme-neovim extras/tmux/marduk-alt.conf):
#   bg #060b12 · visual #2a2a2a · comment #505050 · fg #f1f1f1
#   grays #888888 #999999 #aaaaaa #c1c1c1 · string #a5aaa7 · accent (teal) #5f8787
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#060b12,fg=#f1f1f1"

set -g status-left-length 40
set -g status-left "#[fg=#060b12,bg=#{?client_prefix,#f1f1f1,#5f8787},bold]  #S #[bg=#060b12] "

set -g window-status-separator ""
set -g window-status-format "#[fg=#505050] #I #W "
set -g window-status-current-format "#[fg=#f1f1f1,bg=#2a2a2a,bold] #I #W#{?window_zoomed_flag, 󰁌,} "
set -g window-status-activity-style "fg=#aaaaaa"
set -g window-status-bell-style "fg=#5f8787"

set -g status-right-length 80
set -g status-right "#[fg=#505050]#{workspace_usage} #[fg=#c1c1c1,bg=#2a2a2a] %H:%M "

set -g pane-border-style "fg=#2a2a2a"
set -g pane-active-border-style "fg=#5f8787"
set -g message-style "bg=#2a2a2a,fg=#f1f1f1"
set -g message-command-style "bg=#2a2a2a,fg=#f1f1f1"
set -g mode-style "bg=#aaaaaa,fg=#060b12"                 # copy-mode selection
set -g copy-mode-match-style "bg=#aaaaaa,fg=#060b12"      # search matches
set -g copy-mode-current-match-style "bg=#5f8787,fg=#060b12"
set -g display-panes-active-colour "#5f8787"
set -g display-panes-colour "#505050"
setw -g clock-mode-colour "#5f8787"

# ── Plugins (tpm) ───────────────────────────────────────────────────────
# prefix + I = install · prefix + U = update · prefix + alt-u = remove unlisted
set -g @plugin 'tmux-plugins/tpm'

# Ctrl-h/j/k/l moves between tmux panes and nvim splits seamlessly
set -g @plugin 'christoomey/vim-tmux-navigator'

# Copy to the macOS clipboard (y in copy mode, prefix + y copies the command line)
set -g @plugin 'tmux-plugins/tmux-yank'

# Sessions survive reboots: prefix + Ctrl-s = save, prefix + Ctrl-r = restore
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'nvim lazygit btop "~claude"'

# CPU / memory usage of the processes below, shown in status-right
set -g @plugin 'sjdonado/tmux-workspace-usage'
set -g @workspace_usage_processes 'tmux|nvim|mason'
set -g @workspace_usage_mem 'on'
set -g @workspace_usage_cpu 'on'
set -g @workspace_usage_interval_delay 5

# Status line hidden until you press the prefix
set -g @plugin 'thesast/tmux-transient-status'

# Saves automatically every 15 min and restores on tmux start.
# Keep it LAST: it hooks into status-right, which the plugins above modify.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Initialize tpm (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
