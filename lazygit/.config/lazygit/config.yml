# lazygit: Black Metal — Marduk (alt), from black-metal-theme-neovim extras/lazygit
#   positives (added/staged) → Gorgoroth accent  #ddeecc
#   negatives (removed/unstaged) → Bathory accent #e78a43
# Loaded via LG_CONFIG_FILE (set in .zshrc), because on macOS lazygit
# otherwise reads ~/Library/Application Support/lazygit/config.yml.
gui:
  nerdFontsVersion: "3"
  border: rounded
  theme:
    activeBorderColor:
      - "#5f8787"
      - bold
    inactiveBorderColor:
      - "#505050"
    searchingActiveBorderColor:
      - "#aaaaaa"
    optionsTextColor:
      - "#a5aaa7"
    selectedLineBgColor:
      - "#2a2a2a"
    inactiveViewSelectedLineBgColor:
      - "#161a20"
    cherryPickedCommitBgColor:
      - "#2a2a2a"
    cherryPickedCommitFgColor:
      - "#5f8787"
    markedBaseCommitBgColor:
      - "#2a2a2a"
    markedBaseCommitFgColor:
      - "#ddeecc"
    unstagedChangesColor:
      - "#e78a43"
    defaultFgColor:
      - "#f1f1f1"
    authorColors:
      "*": "#999999"
git:
  # Diffs rendered by delta (lazygit only — plain `git diff` is untouched).
  # Context lines use the marduk-alt syntax theme (bat), changes use the accents.
  diffRenderers:
    - type: stdinFilter
      name: delta
      colorArg: always
      command: >-
        delta --dark --paging=never --line-numbers --syntax-theme=marduk-alt --zero-style='syntax' --plus-style='#ddeecc #1c2416' --plus-emph-style='bold #eef7e4 #33422a' --plus-non-emph-style='#ddeecc #1c2416' --minus-style='#e78a43 #2e170f' --minus-emph-style='bold #fbcb97 #4e2616' --minus-non-emph-style='#e78a43 #2e170f' --line-numbers-plus-style='#ddeecc' --line-numbers-minus-style='#e78a43' --line-numbers-zero-style='#505050' --line-numbers-left-style='#2a2a2a' --line-numbers-right-style='#2a2a2a' --file-style='bold #f1f1f1' --file-decoration-style='#5f8787 ul' --hunk-header-style='line-number syntax' --hunk-header-line-number-style='#5f8787' --hunk-header-decoration-style='#2a2a2a box'
