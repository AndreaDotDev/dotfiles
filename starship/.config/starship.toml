"$schema" = 'https://starship.rs/config-schema.json'

# Colors: Black Metal — Marduk (alt), palette from black-metal-theme-neovim extras/starship
palette = "marduk_alt"

add_newline = true
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$nodejs\
$bun\
$docker_context\
$cmd_duration
$character"""

right_format = "$status$jobs"

[palettes.marduk_alt]
bg = "#060b12"
fg = "#f1f1f1"
alt = "#5f8787"     # the only accent: teal
comment = "#505050"
visual = "#2a2a2a"
gray1 = "#888888"
gray2 = "#999999"
gray3 = "#aaaaaa"
gray4 = "#c1c1c1"
string = "#a5aaa7"
type = "#626b67"

[character]
success_symbol = "[❯](bold fg)"
error_symbol = "[❯](bold alt)"

[directory]
style = "bold alt"
truncation_length = 4
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "comment"

[git_branch]
symbol = " "
style = "gray3"
format = "[on](comment) [$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "gray4"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "≡"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_state]
style = "bold alt"

[python]
symbol = " "
style = "gray4"
format = '[via](comment) [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[nodejs]
symbol = " "
style = "gray4"
format = "[via](comment) [$symbol($version )]($style)"

[bun]
symbol = " "
style = "gray4"
format = "[via](comment) [$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "gray2"

[cmd_duration]
min_time = 2000
style = "gray2"
format = "[took](comment) [ $duration]($style)"

[status]
disabled = false
symbol = "✘ "
style = "bold alt"
format = "[$symbol$status]($style)"

[jobs]
symbol = " "
style = "gray3"
